[project]
name = "mizaniq-next"
version = "0.1.0"
description = "MizanIQ-Next V0-01A minimal synthetic-only FastAPI foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.121.0",
  "uvicorn==0.38.0",
  "pydantic==2.14.0",
  "pydantic-settings==2.14.2",
  "starlette==0.49.3",
  "anyio==4.12.1",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
  "pytest==7.4.4",
  "ruff==0.14.3",
  "mypy==1.11.2",
  "black==24.8.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "negative: CI negative-control demonstrations (not part of required gate)",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
